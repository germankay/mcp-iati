name: Lint and test

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    # 3.14 only: pyproject.toml declares requires-python >= 3.14, so older
    # versions cannot install the package.
    - name: Set up Python 3.14
      run: uv python install 3.14

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      run: uv pip install .[dev]

    - name: Run ruff
      # Rule selection lives in pyproject.toml ([tool.ruff.lint] select).
      run: uv run ruff check src

    - name: Run tests
      # Tests run offline (synthetic data cache via conftest) and guarantee
      # that the tools embed the raw data in the AI-facing response.
      run: uv run pytest
