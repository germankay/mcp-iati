name: Lint and test

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    # Solo 3.14: pyproject.toml declara requires-python >= 3.14, asi que
    # versiones anteriores no pueden instalar el paquete.
    - name: Set up Python 3.14
      run: uv python install 3.14

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      run: uv pip install .[dev]

    - name: Run ruff
      # Rule selection lives in pyproject.toml ([tool.ruff.lint] select).
      run: uv run ruff check src

    - name: Run tests
      # Los tests corren offline (cache de datos sintetico via conftest) y
      # garantizan que las tools embeben los datos crudos en la respuesta a la IA.
      run: uv run pytest
